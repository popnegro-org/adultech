name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ivana_cain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ivana_cain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ivana_cain?schema=public
      AUTH_SECRET: ci-only-secret-that-is-long-enough-for-authjs-validation
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Detect generated npm lockfile
        id: npm-lockfile
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "untracked=false" >> "$GITHUB_OUTPUT"
          else
            echo "untracked=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated npm lockfile
        if: steps.npm-lockfile.outputs.untracked == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ivanacain-generated-package-lock
          path: package-lock.json
          retention-days: 1
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate:deploy
      - run: npm run test:db
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
